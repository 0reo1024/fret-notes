name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: npm run desktop:build
      - run: node scripts/install-desktop.mjs --no-install
      - name: Rename installer
        shell: pwsh
        run: Copy-Item "release/Fret Notes Setup *.exe" "release/FretNotes-Setup-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: release/FretNotes-Setup-windows-x64.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin
      - name: Check bundle
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Fret Notes.app"
          plutil -p "$APP/Contents/Info.plist" | grep NSMicrophoneUsageDescription
          codesign -dv "$APP"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg FretNotes-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: FretNotes-macos-universal.dmg }

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Fret Notes ${GITHUB_REF_NAME#v}" --generate-notes \
            FretNotes-Setup-windows-x64.exe FretNotes-macos-universal.dmg
