[package]
name = "fret-notes"
version = "1.1.0"
description = "Fret Notes desktop"
edition = "2024"
default-run = "fret-notes"

[lib]
name = "fret_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
